
name: CocoCloud Kids - Moving Bus V3

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-video:
    runs-on: ubuntu-latest
    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng

      - name: Create animated bus video
        run: |
          mkdir -p output

          cat > poem.txt <<'EOF'
          Beep beep, here we go,
          Rolling past the fields below.
          Round round wheels go round and round,
          Happy friends make joyful sounds.
          Beep beep, sunny sky,
          CocoCloud bus goes rolling by!
          EOF

          espeak-ng -v en-us -s 135 -f poem.txt -w output/voice.wav

          ffmpeg -y \
            -f lavfi -i "color=c=skyblue:s=720x1280:r=24:d=20" \
            -i output/voice.wav \
            -filter_complex "
            [0:v]
            drawbox=x=0:y=850:w=720:h=430:color=lightgreen:t=fill,
            drawbox=x=0:y=1030:w=720:h=250:color=gray:t=fill,
            drawbox=x=0:y=1050:w=720:h=8:color=white:t=fill,
            drawbox=x=0:y=1210:w=720:h=8:color=white:t=fill,
            drawbox=x=100+mod(t*80\,800):y=1110:w=90:h=10:color=white:t=fill,
            drawbox=x=150+20*sin(t):y=690:w=420:h=190:color=yellow:t=fill,
            drawbox=x=220:y=610:w=250:h=90:color=orange:t=fill,
            drawbox=x=185:y=720:w=80:h=65:color=lightblue:t=fill,
            drawbox=x=285:y=720:w=80:h=65:color=lightblue:t=fill,
            drawbox=x=385:y=720:w=80:h=65:color=lightblue:t=fill,
            drawbox=x=210+20*sin(t):y=850:w=90:h=90:color=black:t=fill,
            drawbox=x=430+20*sin(t):y=850:w=90:h=90:color=black:t=fill,
            drawbox=x=245+20*sin(t):y=875:w=20:h=40:color=white:t=fill,
            drawbox=x=465+20*sin(t):y=875:w=20:h=40:color=white:t=fill,
            drawtext=text='CocoCloud Kids':fontcolor=blue:fontsize=42:x=(w-text_w)/2:y=250,
            drawtext=text='Beep Beep Bus!':fontcolor=white:fontsize=38:x=(w-text_w)/2:y=400
            [v]" \
            -map "[v]" -map 1:a \
            -c:v libx264 -pix_fmt yuv420p \
            -c:a aac -shortest -movflags +faststart \
            output/cococloud-moving-bus.mp4

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: cococloud-moving-bus
          path: output/cococloud-moving-bus.mp4
          retention-days: 7
