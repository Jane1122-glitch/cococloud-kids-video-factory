
name: CocoCloud Kids - Cartoon Video V2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-video:
    runs-on: ubuntu-latest
    steps:
      - name: Install video tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng

      - name: Create cartoon bus video
        run: |
          mkdir -p output
          cat > poem.txt <<'EOF'
          Beep beep, here we go,
          On the road where flowers grow.
          Happy clouds up in the sky,
          CocoCloud bus goes rolling by!
          Beep beep, one two three,
          Come and sing along with me!
          EOF

          espeak-ng -v en-us -s 135 -f poem.txt -w output/narration.wav

          ffmpeg -y \
            -f lavfi \
            -i "color=c=lightblue:s=720x1280:r=24:d=20" \
            -i output/narration.wav \
            -vf "drawbox=x=0:y=850:w=720:h=430:color=lightgreen:t=fill,drawbox=x=0:y=1010:w=720:h=35:color=gray:t=fill,drawbox=x=100:y=650:w=520:h=190:color=yellow:t=fill,drawbox=x=160:y=570:w=340:h=100:color=orange:t=fill,drawbox=x=145:y=690:w=100:h=80:color=lightblue:t=fill,drawbox=x=265:y=690:w=100:h=80:color=lightblue:t=fill,drawbox=x=385:y=690:w=100:h=80:color=lightblue:t=fill,drawbox=x=175:y=820:w=90:h=90:color=black:t=fill,drawbox=x=445:y=820:w=90:h=90:color=black:t=fill,drawtext=text='CocoCloud Kids':fontcolor=blue:fontsize=42:x=(w-text_w)/2:y=250,drawtext=text='Beep Beep Bus!':fontcolor=white:fontsize=38:x=(w-text_w)/2:y=400" \
            -map 0:v -map 1:a \
            -c:v libx264 -pix_fmt yuv420p \
            -c:a aac -shortest -movflags +faststart \
            output/cococloud-cartoon-v2.mp4

      - name: Upload finished video
        uses: actions/upload-artifact@v4
        with:
          name: cococloud-cartoon-v2
          path: output/cococloud-cartoon-v2.mp4
          if-no-files-found: error
          retention-days: 7
