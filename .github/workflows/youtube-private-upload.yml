name: CocoCloud Kids - Auto Upload to YouTube (Private)

on:
  workflow_run:
    workflows:
      - "CocoCloud Kids - Happy Bus Poem"
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  actions: read

jobs:
  upload-private:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Download finished Happy Bus video artifact
        uses: actions/download-artifact@v4
        with:
          name: cococloud-happy-bus-poem
          path: video
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install YouTube upload library
        run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib

      - name: Upload video as PRIVATE
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          required = ["YOUTUBE_CLIENT_ID", "YOUTUBE_CLIENT_SECRET", "YOUTUBE_REFRESH_TOKEN"]
          missing = [key for key in required if not os.environ.get(key)]
          if missing:
              raise SystemExit(
                  "Missing GitHub Actions secrets: " + ", ".join(missing) +
                  ". Add them in Settings > Secrets and variables > Actions."
              )

          candidates = list(Path("video").glob("*.mp4"))
          if len(candidates) != 1:
              raise SystemExit(f"Expected exactly one MP4 in downloaded artifact; found {len(candidates)}.")

          credentials = Credentials(
              token=None,
              refresh_token=os.environ["YOUTUBE_REFRESH_TOKEN"],
              token_uri="https://oauth2.googleapis.com/token",
              client_id=os.environ["YOUTUBE_CLIENT_ID"],
              client_secret=os.environ["YOUTUBE_CLIENT_SECRET"],
              scopes=["https://www.googleapis.com/auth/youtube.upload"],
          )
          youtube = build("youtube", "v3", credentials=credentials, cache_discovery=False)

          request = youtube.videos().insert(
              part="snippet,status",
              body={
                  "snippet": {
                      "title": "The Happy Little Bus | CocoCloud Kids",
                      "description": (
                          "Beep beep! Sing along with the Happy Little Bus. "
                          "A cheerful original nursery rhyme from CocoCloud Kids.\n\n"
                          "#CocoCloudKids #KidsSongs #NurseryRhymes"
                      ),
                      "tags": ["CocoCloud Kids", "kids songs", "nursery rhymes", "happy bus", "children's songs"],
                      "categoryId": "22",
                  },
                  "status": {
                      "privacyStatus": "private",
                      "selfDeclaredMadeForKids": True,
                  },
              },
              media_body=MediaFileUpload(str(candidates[0]), mimetype="video/mp4", resumable=True),
          )
          response = request.execute()
          print("Upload complete. Video ID:", response["id"])
          print("Privacy: PRIVATE")
          print("YouTube Studio link: https://studio.youtube.com/video/" + response["id"] + "/edit")
          PY
